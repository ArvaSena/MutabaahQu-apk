name: Build MutabaahQu APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode Proyek
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Siapkan Properti AndroidX
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Rakit File APK Debug
        run: gradle assembleDebug --no-daemon

      - name: Siapkan File APK untuk Di-download
        uses: actions/upload-artifact@v4
        with:
          name: MutabaahQu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
